<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOCTA — ライセンスキー管理（CEO専用・全アプリ共通）</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0A0906; color:rgba(232,224,208,0.8); font-family:'Courier New',monospace; padding:2rem; min-height:100vh; }
    h1 { font-size:1rem; letter-spacing:0.3em; color:rgba(232,224,208,0.4); margin-bottom:0.4rem; }
    .sub { font-size:0.72rem; color:rgba(232,224,208,0.3); margin-bottom:2rem; }
    .section { margin-bottom:2.4rem; }
    label { display:block; font-size:0.75rem; letter-spacing:0.15em; color:rgba(232,224,208,0.4); margin-bottom:0.5rem; }
    input, textarea, select {
      width:100%; max-width:480px;
      background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.16);
      border-radius:6px; padding:0.6rem 0.9rem;
      color:rgba(232,224,208,0.85); font-family:'Courier New',monospace; font-size:0.85rem; outline:none;
    }
    textarea { height:120px; resize:vertical; }
    button {
      margin-top:0.7rem;
      background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
      border-radius:6px; padding:0.45rem 1.2rem;
      color:rgba(232,224,208,0.7); font-size:0.8rem; letter-spacing:0.1em; cursor:pointer; transition:all 0.2s;
    }
    button:hover { background:rgba(255,255,255,0.16); color:#fff; }
    .result {
      margin-top:0.8rem; padding:0.6rem 0.9rem;
      background:rgba(255,255,255,0.04); border-radius:6px;
      font-size:0.82rem; word-break:break-all; color:rgba(120,200,160,0.9); max-width:480px;
    }
    .note { font-size:0.72rem; color:rgba(232,224,208,0.3); margin-top:0.4rem; line-height:1.7; }
    code { color:rgba(184,180,174,0.8); }
    hr { border:none; border-top:1px solid rgba(255,255,255,0.08); margin:2rem 0; }
  </style>
</head>
<body>
<h1>NOCTA — LICENSE KEY MANAGER</h1>
<div class="sub">全アプリ共通（still / Seed / Verse / inner canvas）。Tier1（ハッシュリスト方式）用。</div>

<div class="section">
  <label>対象アプリ（手順表示用）</label>
  <select id="app-select">
    <option value="still">still（GitHub Pages / website/still/）</option>
    <option value="seed">Seed（Vercel）</option>
    <option value="verse">Verse（Vercel）</option>
    <option value="inner-canvas">inner canvas（Vercel）</option>
  </select>
</div>

<div class="section">
  <label>ライセンスキー → SHA-256ハッシュ変換</label>
  <input id="key-input" type="text" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX">
  <button onclick="convertKey()">ハッシュを生成</button>
  <div class="result" id="hash-result" style="display:none;"></div>
  <p class="note">Gumroadで発行されたライセンスキーを貼り付けてください。<br>大文字に正規化してハッシュ化します（アプリ側と一致）。</p>
</div>

<hr>

<div class="section">
  <label id="steps-label">licenses.json 更新手順</label>
  <p class="note" id="steps"></p>
</div>

<script>
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function convertKey() {
  const val = document.getElementById('key-input').value.trim().toUpperCase();
  if (!val) return;
  const hash = await sha256(val);
  const el = document.getElementById('hash-result');
  el.style.display = 'block';
  el.textContent = hash;
}

function renderSteps() {
  const app = document.getElementById('app-select').value;
  const isStill = app === 'still';
  const path = isStill ? `website/still/licenses.json` : `（${app} の Vercel リポジトリ）public/licenses.json`;
  const deploy = isStill
    ? `3. sw.js の CACHE バージョンを still-v4, v5... とインクリメント<br>
       4. <code>git add website/${app}/licenses.json website/${app}/sw.js</code><br>
       5. <code>git commit -m "feat(${app}): ライセンスキー追加"</code><br>
       6. <code>git push origin main</code>（GitHub Pages 自動デプロイ）`
    : `3. <code>${app}</code> の Vercel リポジトリで licenses.json を更新<br>
       4. commit → push（Vercel 自動デプロイ）<br>
       ※ PWA キャッシュがある場合は sw.js のバージョンもインクリメント`;
  document.getElementById('steps').innerHTML =
    `1. 上でハッシュを生成する<br>` +
    `2. <code>${path}</code> の "hashes" 配列にハッシュを追加<br>` +
    deploy +
    `<br><br>注意: Tier2（Gumroad License API）運用に切り替えると、この手作業は不要になります。`;
}

document.getElementById('app-select').addEventListener('change', renderSteps);
document.getElementById('key-input').addEventListener('keydown', e => { if (e.key === 'Enter') convertKey(); });
renderSteps();
</script>
</body>
</html>
