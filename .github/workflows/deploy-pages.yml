name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Node.js 20 を使う旧バージョンは非推奨になり Node.js 24 で強制実行されていたため、
      # 2026-09-06 に4つの action をすべて Node.js 24 対応版へ更新した。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # website/ の中身はそのままサイトルートとして公開されるため、
      # 内部向けドキュメントが混ざると誰でも読める状態になる。
      # ランナー上のチェックアウトから消すだけで、リポジトリ側のファイルは残る。
      - name: Remove internal docs from the published artifact
        run: |
          rm -f website/CLAUDE.md \
                website/DESIGN.md \
                website/DESIGN-NOTES.md \
                website/the-first-flower/DESIGN-NOTES.md
          echo "公開対象から除外した後の Markdown 一覧:"
          find website -name '*.md' -print || true

      # v4 以降はドットファイルが artifact に含まれない（include-hidden-files 既定 false）。
      # website/ 配下で git 追跡されている隠しファイルは still/audio/.gitkeep だけで
      # 公開に不要なため、既定のまま除外させる。アンダースコア始まりのパスもないので
      # .nojekyll は要らない。
      - name: Upload website directory
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
