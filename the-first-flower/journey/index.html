<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>旅の一枚 — The First Flower</title>
<meta name="description" content="The First Flower の作者が、日本と世界の行った場所で撮った景色を、漢字の地図から地域ごとに選んで並べています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 色と書体は公開中の旅の一枚（journey/index.html）のトークンに合わせる */
:root{
  --bg:#FCFBF5; --ink:#3D2E52; --sub:#9A86B0; --meta:#6F6280;
  --yes:#EEA4C0; --yes-h:#E995B6; --onyes:#3D2E52; --ontile:#FFFFFF; --no:#E6E0EC; --onno:#60566B;
  --cur:#B168A8; --oncur:#FFFFFF; --cur-deep:#A05A98; --edge:#FCFBF5;
  --line:rgba(177,104,168,.35); --card:#FFFFFF; --shade:rgba(61,46,82,.22);
  --veil:rgba(61,46,82,.66); --glow:rgba(177,104,168,.3); --glow2:rgba(238,164,192,.75);
  --mh:clamp(400px,calc(100vh - 250px),720px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1B1630; --ink:#F1EAF7; --sub:#B6A6CE; --meta:#C8BCE0;
    --yes:#E9A5C6; --yes-h:#F2B6D1; --onyes:#2A1F44; --ontile:#2A1F44; --no:#3A3157; --onno:#C8BCE0;
    --cur:#E3AEDB; --oncur:#2A1F44; --cur-deep:#E3AEDB; --edge:#1B1630;
    --line:rgba(227,174,219,.35); --card:#262040; --shade:rgba(0,0,0,.4);
    --veil:rgba(10,6,24,.78); --glow:rgba(227,174,219,.35); --glow2:rgba(233,165,198,.6);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",sans-serif;font-weight:400;font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nb{display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.page{max-width:1240px;margin:0 auto;padding:12px 18px 40px}
.back{color:var(--sub);font-size:13px;letter-spacing:.08em;text-decoration:none}
.back:hover{color:var(--cur)}
@media (prefers-color-scheme:light){.back{color:var(--meta)}}

.hero{display:grid;gap:8px 40px;margin:4px 0 10px;align-items:end}
@media(min-width:900px){.hero{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
h1{font-family:"Noto Serif JP",serif;font-weight:400;font-size:clamp(28px,7vw,36px);line-height:1.2;margin:0}
.lead{margin:4px 0 0;max-width:46em;font-size:14px;color:var(--meta)}
.hr{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:8px 16px}
@media(min-width:900px){.hr{justify-content:flex-end}}
.total{font-size:13px;color:var(--meta)}
.tabs2{display:inline-flex;padding:3px;border-radius:999px;background:var(--no)}
.tabs2 button{border:0;border-radius:999px;padding:6px 18px;min-height:40px;font-size:14px;display:inline-flex;align-items:baseline;gap:6px}
.tabs2 button small{font-size:12px;color:var(--meta)}
.tabs2 button[aria-pressed="true"]{background:#fff;color:#3D2E52;box-shadow:0 1px 3px rgba(61,46,82,.12)}
.tabs2 button[aria-pressed="true"] small{color:#6F6280}

/* 地方ボタン: タイルの並びを写した形入り。スマホは 1 行の横スクロールで、右端のボタンを半分見せ、大きい矢印を添える */
.rwrap{position:relative;margin:0 -18px 6px}
.regions{display:flex;gap:7px;overflow-x:auto;padding:6px 18px 12px;scrollbar-width:none;
  --fl:0px;--fr:0px;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 var(--fl),#000 calc(100% - var(--fr)),transparent 100%)}
.regions::-webkit-scrollbar{display:none}
@media(min-width:960px){
  .rwrap{margin:0 0 4px}
  .regions{flex-wrap:wrap;overflow:visible;padding:6px 6px 10px;margin:0 -6px;gap:5px;-webkit-mask-image:none;mask-image:none}
  .rb{padding:0 10px 0 6px!important;gap:5px!important;font-size:14px!important}
  .rn{display:none!important}
}
.rb{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px;font-weight:500;white-space:nowrap;transition:background .12s,box-shadow .6s ease,border-color .6s ease}
.rb:hover{border-color:var(--cur)}
.rb.glow{border-color:var(--cur);box-shadow:0 0 0 3px var(--glow),0 0 14px var(--glow2)}
.rb .mini{width:30px;height:30px;flex:0 0 30px}
.rb .mini rect{fill:var(--no)}
.rb .mini rect.y{fill:var(--yes)}
.rb .ct{font-size:12px;color:var(--meta)}
.rb[aria-pressed="true"]{background:var(--cur-deep);border-color:var(--cur-deep);color:#fff}
.rb[aria-pressed="true"] .ct{color:#fff}
@media (prefers-color-scheme:dark){.rb[aria-pressed="true"]{color:#2A1F44}.rb[aria-pressed="true"] .ct{color:#2A1F44}}
.rb[aria-pressed="true"] .mini rect{fill:rgba(255,255,255,.35)}
.rb[aria-pressed="true"] .mini rect.y{fill:#F8C9DC}
.rn{position:absolute;top:6px;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--cur);background:var(--bg);display:none;align-items:center;justify-content:center;font-size:30px;line-height:1;z-index:2;color:var(--ink);box-shadow:0 2px 10px rgba(61,46,82,.28)}
.rn.on{display:flex}
.rn.l{left:4px}.rn.r{right:4px;animation:nudge 1.8s ease-in-out 3}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}

/* stage */
.stage{display:grid;gap:12px 32px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){
  .stage{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:start}
  .panel{position:sticky;top:10px}
}
.mapcard{position:relative;height:clamp(340px,108vw,470px);overflow:hidden;animation:enter .85s ease both}
.mapcard.world{height:clamp(220px,62vw,320px)}
@media(min-width:960px){.mapcard{height:var(--mh)}.mapcard.world{height:min(var(--mh),560px)}}
@keyframes enter{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.mapcard svg{position:absolute;inset:0;display:block;width:100%;height:100%}
#mapS{pointer-events:none;visibility:hidden}

/* タイル（公開ページと同じ配色） */
#mapT .tshade{fill:var(--shade)}
#mapT .tl{fill:var(--no)}
#mapT .tile.yes .tl{fill:var(--yes);transition:fill .15s}
#mapT .tile.yes{cursor:pointer}
#mapT .tile.yes:hover .tl{fill:var(--yes-h)}
#mapT .tile.sel .tl{fill:var(--cur)}
#mapT .ch{font-family:"Noto Serif JP",serif;font-weight:600;fill:var(--onno);text-anchor:middle;pointer-events:none}
#mapT .nm{font-family:"Noto Sans JP",sans-serif;font-weight:500;fill:var(--onno);text-anchor:middle;pointer-events:none}
#mapT .tile.yes .ch,#mapT .tile.yes .nm{fill:var(--ontile)}
#mapT .tile.sel .ch,#mapT .tile.sel .nm{fill:var(--oncur)}

/* 県の本当の形 */
#mapS .sh{stroke:var(--edge);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;fill:var(--no)}
#mapS .sh.yes{fill:var(--yes);cursor:pointer;pointer-events:auto;transition:fill .15s}
#mapS .sh.yes:hover{fill:var(--yes-h)}
#mapS .sh.sel{fill:var(--cur)}
#mapS .shd{fill:var(--shade);stroke:none}
#mapS .kan{font-family:"Noto Serif JP",serif;font-weight:600;fill:var(--onyes);stroke:var(--edge);paint-order:stroke;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
#mapS .kan.no{fill:var(--onno)}
#mapS .lab{font-family:"Noto Sans JP",sans-serif;font-weight:500;fill:var(--ink);stroke:var(--edge);paint-order:stroke;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
#mapS .lab.no{fill:var(--onno)}
#mapS .stem{stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke;opacity:.5}
#mapS .stemdot{fill:var(--ink)}
#mapS .bloom{cursor:pointer;outline:none;pointer-events:auto}
#mapS .flower{transition:transform .2s ease;transform-origin:0 0}
#mapS .bloom:hover .flower{transform:scale(1.1)}
#mapS .pring{fill:none;stroke:var(--edge);stroke-width:2.5}
#mapS .selring,#mapS .fr,#mapS .fr2{fill:none;opacity:0}
#mapS .selring{stroke:var(--cur);stroke-width:3.5}
#mapS .fr2{stroke:var(--bg);stroke-width:7}
#mapS .fr{stroke:var(--ink);stroke-width:3;stroke-dasharray:5 3}
#mapS .bloom.sel .selring{opacity:1}
#mapS .bloom:focus-visible .fr,#mapS .bloom:focus-visible .fr2{opacity:1}
#mapS .hit{fill:transparent}

/* panel */
.panel{min-width:0;animation:enter .85s ease .1s both}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:13px;margin:0 0 4px;min-height:34px}
.crumb button{border:1px solid var(--line);border-radius:999px;padding:2px 12px;min-height:34px;font-weight:500;color:var(--ink)}
.crumb .sep{color:var(--meta)}
.crumb .here{color:var(--meta)}
.panel h2{font-family:"Noto Serif JP",serif;font-weight:400;font-size:clamp(22px,4vw,28px);line-height:1.3;margin:0}
.panel h2:focus{outline:none}
.meta{margin:2px 0 10px;font-size:13px;color:var(--meta)}
.head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.stamp{flex:0 0 50px;width:50px;height:50px;border-radius:4px;background:var(--yes);color:var(--onyes);font-family:"Noto Serif JP",serif;font-weight:600;font-size:28px;line-height:50px;text-align:center}
.nrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px}
.fn{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--meta)}
.fn svg{width:22px;height:22px;flex:0 0 22px}
.tiles{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.tiles.few{gap:12px}
.tile2{display:flex;flex-direction:column;align-items:stretch;gap:4px;width:100%;border:0;padding:0;text-align:center}
.tile2 .ph{display:block;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--no);opacity:.92;transition:opacity .2s}
.tiles.few .tile2 .ph{aspect-ratio:4/3}
.tile2:hover .ph{opacity:1}
.tile2 img{display:block;width:100%;height:100%;object-fit:cover}
.tile2 b{font-size:12.5px;font-weight:400;line-height:1.25}
.tiles.few .tile2 b{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button{border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:40px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--cur-deep);border-color:var(--cur-deep);color:#fff}
@media (prefers-color-scheme:dark){.chips button[aria-pressed="true"]{color:#2A1F44}}
.pbox{position:relative;display:grid;place-items:center;border-radius:6px;background:#EFEAF1;overflow:hidden}
@media (prefers-color-scheme:dark){.pbox{background:#2B2342}}
.pbox img{display:block;max-width:100%;max-height:min(42vh,400px);width:auto;height:auto;transition:opacity .45s ease}
.pbox img.loading{opacity:0}
.pn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(252,251,245,.86);color:#3D2E52;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(61,46,82,.18)}
.pn.p{left:10px}.pn.n{right:10px}
.pn:disabled{opacity:.3;cursor:default}
.pcount{position:absolute;left:10px;bottom:10px;background:var(--veil);color:#fff;border-radius:999px;padding:0 10px;font-size:12px;letter-spacing:.06em;line-height:22px}
.cap{margin:8px 2px 0;font-size:14px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:thin}
.th{flex:0 0 auto;border:0;padding:0;border-radius:4px}
.th img{display:block;height:48px;width:auto;border-radius:4px;opacity:.6}
.th:hover img{opacity:1}
.th[aria-pressed="true"] img{opacity:1;outline:2px solid var(--cur);outline-offset:2px}

/* 全国の右側: ゆっくり流れる 1 枚 + 和の色見本帳 */
.slide{position:relative;height:clamp(200px,34vh,330px);border-radius:6px;overflow:hidden;background:var(--no)}
.slidebtn{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;display:block}
.slidebtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.slidebtn img.on{opacity:1}
.scap{position:absolute;left:10px;bottom:10px;background:var(--veil);color:#fff;border-radius:999px;padding:0 12px;font-size:13px;line-height:26px;pointer-events:none}
.sctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.sctl button{min-width:40px;height:40px;border-radius:999px;border:0;background:rgba(252,251,245,.88);color:#3D2E52;font-size:13px;font-weight:500;padding:0 12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(61,46,82,.2)}
.sctl button.ic{padding:0;font-size:20px;line-height:1}
.swatch{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px 6px;margin:16px 0 0;padding:0 0 2px;list-style:none}
@media(min-width:960px){.swatch{grid-template-columns:repeat(10,minmax(0,1fr))}}
.swatch li:nth-child(4n+1){--a:-1.6deg}
.swatch li:nth-child(4n+2){--a:1.2deg}
.swatch li:nth-child(4n+3){--a:-.5deg}
.swatch li:nth-child(4n){--a:1.8deg}
.sw{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;border:0;padding:0;text-align:center;border-radius:6px}
.cards{position:relative;display:block;width:42px;height:70px}
/* 和紙の色紙: 薄い影、やや不揃いな角度と角、端の柔らかなにじみ、軽い繊維 */
.cards .c{position:absolute;inset:0;display:block;border-radius:2px 4px 3px 5px / 4px 2px 5px 3px;
  background-image:
    radial-gradient(120% 90% at 18% 8%,rgba(255,255,255,.38),rgba(255,255,255,0) 62%),
    repeating-linear-gradient(97deg,rgba(255,255,255,.22) 0 1px,rgba(255,255,255,0) 1px 3px),
    repeating-linear-gradient(11deg,rgba(111,98,128,.05) 0 1px,rgba(111,98,128,0) 1px 6px);
  box-shadow:inset 0 0 7px rgba(255,255,255,.5),0 1px 1px rgba(61,46,82,.08),0 6px 8px -6px rgba(61,46,82,.32);
  transition:transform .5s ease,box-shadow .6s ease,background-color .6s ease}
.cards .c1{z-index:3;transform:rotate(var(--a,0deg))}
.cards .c2{z-index:2;transform:rotate(calc(var(--a,0deg) + 8deg)) translateX(3px);transform-origin:50% 100%}
.cards .c3{z-index:1;transform:rotate(calc(var(--a,0deg) - 9deg)) translateX(-3px);transform-origin:50% 100%}
.cards .cn{position:absolute;top:12px;left:50%;transform:translateX(-50%);writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;font-weight:600;font-size:13px;letter-spacing:.14em;line-height:1;white-space:nowrap;color:#3D2E52}
.sw:hover .c2{transform:rotate(calc(var(--a,0deg) + 14deg)) translateX(7px)}
.sw:hover .c3{transform:rotate(calc(var(--a,0deg) - 15deg)) translateX(-7px)}
.sw.glow .c1{box-shadow:inset 0 0 7px rgba(255,255,255,.5),0 0 0 1.5px var(--cur),0 0 14px var(--glow2);transform:translateY(-3px) rotate(var(--a,0deg))}
.sw .sn{font-size:12px;line-height:1.3;white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .mapcard,.panel{animation:none}
  .rn.r{animation:none}
  #mapS .flower,#mapT .tile.yes .tl,#mapS .sh.yes,.tile2 .ph,.rb,.pbox img,.slidebtn img,.cards .c{transition:none}
  #mapS .bloom:hover .flower{transform:none}
  .sw:hover .c2{transform:rotate(calc(var(--a,0deg) + 8deg)) translateX(3px)}
  .sw:hover .c3{transform:rotate(calc(var(--a,0deg) - 9deg)) translateX(-3px)}
}
[hidden]{display:none!important}
.empty{font-family:"Noto Serif JP",serif;font-size:15px;color:var(--meta);padding:48px 0}
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../index.html#profile">&larr; The First Flower</a>

  <section class="hero" aria-labelledby="ttl">
    <div>
      <h1 id="ttl">旅の一枚</h1>
      <p class="lead"><span class="nb">漢字の地図で、</span><span class="nb">地方を押すと、</span><span class="nb">県の形があらわれて、</span><span class="nb">写真が咲きます。</span></p>
    </div>
    <div class="hr">
      <span class="total" id="total"></span>
      <div class="tabs2" role="group" aria-label="地図の切り替え">
        <button type="button" id="bJp" aria-pressed="true">日本<small id="nJp"></small></button>
        <button type="button" id="bWd" aria-pressed="false">世界<small id="nWd"></small></button>
      </div>
    </div>
  </section>

  <div class="rwrap">
    <button type="button" class="rn l" id="rnL" aria-label="地方ボタンを左へ">&#8249;</button>
    <div class="regions" id="regions" role="group" aria-label="地方を選ぶと、地図がその地方へ寄ります"></div>
    <button type="button" class="rn r" id="rnR" aria-label="地方ボタンを右へ">&#8250;</button>
  </div>

  <main class="stage">
    <section class="mapcard" id="mapcard" aria-label="旅の地図">
      <svg id="mapT" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="漢字タイルの地図。桜色が行った場所"></svg>
      <svg id="mapS" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="寄った地方の県の形。桜色が行った場所"></svg>
    </section>
    <section class="panel" id="panel" aria-label="選んだ場所の写真"><noscript>この地図は JavaScript を使います。</noscript></section>
  </main>
  <div class="sr" id="sr" aria-live="polite"></div>
</div>

<script src="journey-core.js?v=20261105"></script>
<script src="journey-shapes.js?v=20261106"></script>
<script src="journey-map.js?v=20261101"></script>
<script src="tff-journey-data.js?v=20261105"></script>
<script>
(function () {
  "use strict";
  var BASE = "";
  var NS = "http://www.w3.org/2000/svg";
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PITCH = 44, TS = 40;

  function J(a, b) { var o = []; for (var i = a; i <= b; i++) { o.push("JP-" + (i < 10 ? "0" + i : i)); } return o; }
  var JREG = [
    { k: "hokkaido", name: "北海道", ids: J(1, 1) },
    { k: "tohoku", name: "東北", ids: J(2, 7) },
    { k: "kanto", name: "関東", ids: J(8, 14) },
    { k: "chubu", name: "中部", ids: J(15, 23) },
    { k: "kinki", name: "近畿", ids: J(24, 30) },
    { k: "chugoku", name: "中国", ids: J(31, 35) },
    { k: "shikoku", name: "四国", ids: J(36, 39) },
    { k: "kyushu", name: "九州", ids: J(40, 46) },
    { k: "okinawa", name: "沖縄", ids: J(47, 47) },
    { k: "fes", name: "夏フェス", ids: ["theme-summer-fes"] }
  ];
  var WREG = [
    { k: "na", name: "北米", ids: ["CA", "US"], box: [90, 40, 250, 135] },
    { k: "asia", name: "アジア", ids: ["KR", "HK", "ID"], box: [555, 70, 665, 200] },
    { k: "oce", name: "オセアニア", ids: ["AU", "GU"], box: [575, 125, 695, 265] }
  ];
  var WANCH = { US: [164, 90], CA: [160, 52], AU: [628, 218], ID: [590, 172], KR: [615.6, 96], HK: [588.4, 123.8], GU: [649.4, 141.5] };
  var WT = [ /* 世界は漢字の略称 + 国名。ごく粗く世界の並びを写した 7 列 × 4 行 */

    im.onerror = function () { cb(null); };
    im.src = BASE + src;
  }
  function computeColors() {
    var my = mode, RAW = {}, left = 0;
    regs.forEach(function (d) {
      var vis = d.ids.filter(isVisit), pick = [];
      var step = Math.max(1, vis.length / 3);
      for (var q = 0; q < vis.length && pick.length < 3; q += step) { pick.push(vis[Math.floor(q)]); }
      RAW[d.k] = []; left += pick.length;
      pick.forEach(function (id, j) {
        var th = repThumb(byId[id]);
        function done(c) {
          RAW[d.k][j] = c; left--;
          if (left === 0 && mode === my) { assignColors(RAW); }
        }
        if (!th) { done(null); } else { loadColor(th, done); }
      });
    });
  }
  /* 全地方の色が出そろったら、伝統色へ寄せる。全体で同じ色名を二度使わない。
     取れなかった地方は決め打ちの色を持ち続けるので、その色名は先に取り置く */
  function assignColors(RAW) {
    var used = {}, capRegs = [];
    regs.forEach(function (d) {
      var has = (RAW[d.k] || []).some(function (c) { return !!c; });
      if (has) { capRegs.push(d); } else { (COLS[d.k] || []).forEach(function (n) { used[n] = 1; }); }
    });
    capRegs.forEach(function (d) {
      var out = [], rgbs = (RAW[d.k] || []).filter(function (c) { return !!c; });
      rgbs.forEach(function (rgb) {
        if (out.length >= 3) { return; }
        var rank = rankWashi(rgb);
        for (var i = 0; i < rank.length; i++) {
          if (!used[rank[i].n]) { used[rank[i].n] = 1; out.push(rank[i].n); break; }
        }
      });
      var pad = rankWashi(rgbs[0]);
      for (var j = 0; out.length < 2 && j < pad.length; j++) {
        if (!used[pad[j].n]) { used[pad[j].n] = 1; out.push(pad[j].n); }
      }
      COLS[d.k] = out;
    });
    paintAll();
  }
  function paintBand(k) {
    var sw = panel.querySelector('.sw[data-k="' + k + '"]'); if (!sw) { return; }
    var names = COLS[k] || [], cls = ["c1", "c2", "c3"], i;
    for (i = 0; i < 3; i++) {
      var c = sw.querySelector("." + cls[i]), nm = names[i] || names[0], w = WBY[nm];
      if (!c || !w) { continue; }
      c.style.backgroundColor = w.hex;
      if (i === 0) {
        var cn = c.querySelector(".cn");
        cn.textContent = nm; cn.style.color = w.lum > .5 ? "#3D2E52" : "#FFFFFF";
      }
    }
    sw.setAttribute("aria-label", sw.getAttribute("data-name") + "へ寄る。写真の色は" + names.join("、"));
  }
  function paintAll() { Object.keys(COLS).forEach(paintBand); }
  function renderAllPanel() {
    var h2 = h("h2", null, mode === "jp" ? "歩いた日本" : "歩いた世界"); h2.tabIndex = -1; panel.appendChild(h2);
    var nPref = items.filter(function (it) { return it.r.kind !== "theme"; }).length, nTheme = items.length - nPref;
    panel.appendChild(h("p", "meta", (mode === "jp" ? "行った県 " + nPref + (nTheme ? "・夏フェス " + nTheme : "") : "行った国 " + items.length) + "。写真か色の札を押すと、その地方へ寄ります。"));

    SL.list = [];
    regs.forEach(function (d) {
      var st = regionStat(d); if (!st.vis.length) { return; }
      var ids = allIds(byId[st.vis[0]]); if (!ids.length) { return; }
      SL.list.push({ d: d, n: st.vis.length, photos: st.photos, src: photos[ids[0]].src });
    });
    var slide = h("div", "slide");
    var btn = h("button", "slidebtn"); btn.type = "button";
    var a = document.createElement("img"), b = document.createElement("img");
    a.alt = ""; b.alt = "";
    btn.appendChild(a); btn.appendChild(b);
    btn.addEventListener("click", function () { var k = btn.getAttribute("data-slide"); if (k) { setScope(k); } });
    slide.appendChild(btn);
    var cap = h("span", "scap"); slide.appendChild(cap);
    var ctl = h("div", "sctl");
    var pv = h("button", "ic", "‹"); pv.type = "button"; pv.setAttribute("aria-label", "前の一枚");
    var ps = h("button", null, SL.paused ? "流す" : "止める"); ps.type = "button"; ps.setAttribute("aria-pressed", String(SL.paused));
    ps.setAttribute("aria-label", "自動で切り替える動きを止める・再開する");
    var nx = h("button", "ic", "›"); nx.type = "button"; nx.setAttribute("aria-label", "次の一枚");
    pv.addEventListener("click", function () { showSlide(SL.i - 1); });
    nx.addEventListener("click", function () { showSlide(SL.i + 1); });
    ps.addEventListener("click", function () {
      SL.paused = !SL.paused; ps.textContent = SL.paused ? "流す" : "止める"; ps.setAttribute("aria-pressed", String(SL.paused)); schedule();
    });
    ctl.appendChild(pv); ctl.appendChild(ps); ctl.appendChild(nx); slide.appendChild(ctl);
    panel.appendChild(slide);
    SL.imgs = [a, b]; SL.front = 1; SL.cap = cap; SL.btn = btn; SL.pbtn = ps;

    /* 和の色見本帳: 淡い和紙の色紙を 3 枚重ねた札。手前の札に縦書きの色名（伝統色の名前） */
    var ul = h("ul", "swatch"); ul.setAttribute("aria-label", "地方ごとの写真の色（和の伝統色）");
    regs.forEach(function (d) {
      var st = regionStat(d); if (!st.vis.length) { return; }
      var li = h("li"), sw = h("button", "sw"); sw.type = "button"; sw.setAttribute("data-k", d.k); sw.setAttribute("data-name", d.name);
      var cards = h("span", "cards");
      var c3 = h("span", "c c3"), c2 = h("span", "c c2"), c1 = h("span", "c c1");
      c1.appendChild(h("span", "cn", ""));
      cards.appendChild(c3); cards.appendChild(c2); cards.appendChild(c1);
      sw.appendChild(cards); sw.appendChild(h("span", "sn", d.name));
      sw.addEventListener("click", function () { setScope(d.k); });
      li.appendChild(sw); ul.appendChild(li);
    });
    panel.appendChild(ul);
    paintAll();

    SL.on = true; SL.front = 1;
    showSlide(0);
    return h2;
  }

  /* ---------- パネル ---------- */
  function tile2(name, title, thumb, onClick) {
    var li = h("li"), b = h("button", "tile2"); b.type = "button"; b.title = title; b.setAttribute("aria-label", title);
    var ph = h("span", "ph");
    if (thumb) { var im = document.createElement("img"); im.src = BASE + thumb; im.alt = ""; im.loading = "lazy"; ph.appendChild(im); }
    b.appendChild(ph); b.appendChild(h("b", null, name));
    b.addEventListener("click", onClick);
    li.appendChild(b);
    return li;
  }
  function crumb(parts) {
    var n = h("nav", "crumb"); n.setAttribute("aria-label", "いまの場所");
    parts.forEach(function (p, i) {
      if (i) { n.appendChild(h("span", "sep", "/")); }
      if (p.go) { var b = h("button", null, p.t); b.type = "button"; b.addEventListener("click", p.go); n.appendChild(b); }
      else { n.appendChild(h("span", "here", p.t)); }
    });
    return n;
  }
  function renderPanel(focusIt) {
    stopSlide();
    panel.textContent = "";
    var h2;
    if (scope === "all" && !prefId) {
      h2 = renderAllPanel();
    } else if (!prefId) {
      var d = regs.filter(function (x) { return x.k === scope; })[0], st2 = regionStat(d);
      panel.appendChild(crumb([{ t: M.label, go: function () { setScope("all"); } }, { t: d.name }]));
      h2 = h("h2", null, d.name); h2.tabIndex = -1; panel.appendChild(h2);
      panel.appendChild(h("p", "meta", (mode === "jp" ? "行った県 " : "行った国 ") + st2.vis.length + "・写真 " + st2.photos + " 枚。花か写真を押してください。"));
      /* 件数が少ないときは写真を大きく並べて、空白を作らない */
      var nn = st2.vis.length, few = nn <= 3;
      var ul2 = h("ul", "tiles" + (few ? " few" : ""));
      ul2.style.setProperty("--cols", String(few ? nn : 5));
      st2.vis.forEach(function (id) {
        var r = byId[id], n = allIds(r).length;
        ul2.appendChild(tile2(r.name, r.name + "。" + n + " 枚", repThumb(r), function () { choosePref(id, true); }));
      });
      panel.appendChild(ul2);
    } else {
      renderDetail();
      h2 = panel.querySelector("h2");
    }
    if (focusIt && h2) { h2.focus({ preventScroll: true }); }
  }
  /* 県の詳細: 「場所の名前 + 枚数」がそのまま読める札にする。県そのものの写真は「代表」、地点は地点名 */
  function renderDetail() {
    var r = byId[prefId], tabR = byId[tab], t = tileBy[prefId];
    var d = regs.filter(function (x) { return x.k === scope; })[0];
    var parts = [{ t: M.label, go: function () { setScope("all"); } }];
    if (d && d.ids.filter(isVisit).length > 1) { parts.push({ t: d.name, go: function () { setScope(d.k); } }); }
    parts.push({ t: r.name });
    panel.appendChild(crumb(parts));

    var head = h("div", "head"); var stp = h("div", "stamp", t.ch); stp.setAttribute("aria-hidden", "true"); head.appendChild(stp);
    var hb = h("div"); var nrow = h("div", "nrow");
    var h2 = h("h2", null, r.name); h2.tabIndex = -1; nrow.appendChild(h2);
    var spec = FL[prefId];
    if (spec && spec.n) {
      var fn = h("span", "fn"); fn.appendChild(flowerIcon(spec)); fn.appendChild(document.createTextNode(spec.n));
      nrow.appendChild(fn);
    }
    hb.appendChild(nrow);
    var ids = allIds(r), places = kids[prefId] || [];
    var mp = h("p", "meta", "全 " + ids.length + " 枚"); mp.style.margin = "0"; hb.appendChild(mp);
    head.appendChild(hb); panel.appendChild(head);

    if (places.length) {
      var tabs = h("div", "chips"); tabs.setAttribute("role", "group"); tabs.setAttribute("aria-label", r.name + "の写真を場所ごとに切り替える");
      /* 「その他」は最後に置く */
      var ps2 = places.filter(function (p) { return p.name !== "その他"; }).concat(places.filter(function (p) { return p.name === "その他"; }));
      var tl = (r.photoIds.length ? [r] : []).concat(ps2);
      tl.forEach(function (x) {
        var label = (x === r ? "代表" : x.name) + " " + x.photoIds.length + " 枚";
        var b = h("button", null, label); b.type = "button";
        b.setAttribute("aria-pressed", String(x.id === tab));
        b.addEventListener("click", function () { tab = x.id; idx = 0; renderPanel(false); });
        tabs.appendChild(b);
      });
      panel.appendChild(tabs);
    }

    var pids = tabR.photoIds, p = photos[pids[idx]];
    var box = h("div", "pbox");
    var img = document.createElement("img");
    img.alt = p.alt || (r.name + "の写真"); img.width = p.w; img.height = p.h;
    img.className = "loading";
    img.onload = function () { img.className = ""; };
    img.src = BASE + p.src;
    box.appendChild(img);
    var pv = h("button", "pn p", "‹"); pv.type = "button"; pv.setAttribute("aria-label", "前の一枚"); pv.disabled = idx === 0;
    var nx = h("button", "pn n", "›"); nx.type = "button"; nx.setAttribute("aria-label", "次の一枚"); nx.disabled = idx >= pids.length - 1;
    pv.addEventListener("click", function () { idx--; renderPanel(false); });
    nx.addEventListener("click", function () { idx++; renderPanel(false); });
    box.appendChild(pv); box.appendChild(nx);
    box.appendChild(h("span", "pcount", (idx + 1) + " / " + pids.length));
    panel.appendChild(box);
    if (p.caption) { panel.appendChild(h("p", "cap", p.caption)); }

    if (pids.length > 1) {
      var th = h("div", "thumbs");
      pids.forEach(function (id, i) {
        var q = photos[id], b = h("button", "th"); b.type = "button";
        b.setAttribute("aria-pressed", String(i === idx)); b.setAttribute("aria-label", (i + 1) + "枚目");
        var ti = document.createElement("img"); ti.src = BASE + q.thumb; ti.alt = ""; ti.height = 48; ti.width = Math.round(48 * q.w / q.h);
        b.appendChild(ti);
        b.addEventListener("click", function () { idx = i; renderPanel(false); });
        th.appendChild(b);
      });
      panel.appendChild(th);
    }
  }

  function counts() {
    var nj = D.regions.filter(function (r) { return r.kind === "pref" || r.kind === "theme"; }).length;
    var nw = D.regions.filter(function (r) { return r.kind === "country"; }).length;
    $("nJp").textContent = String(nj); $("nWd").textContent = String(nw);
    $("total").textContent = "写真 " + Object.keys(photos).length + " 枚";
  }

  function setMode(m) {
    if (anim) { cancelAnimationFrame(anim); anim = null; }
    mode = m; scope = "all"; prefId = null; tab = null; idx = 0;
    $("bJp").setAttribute("aria-pressed", String(m === "jp"));
    $("bWd").setAttribute("aria-pressed", String(m === "world"));
    cont.classList.toggle("world", m === "world");
    buildMap();
    buildButtons();
    setTargets();
    jump();
    markSel();
    renderPanel(false);
  }
  $("bJp").addEventListener("click", function () { if (mode !== "jp") { setMode("jp"); } });
  $("bWd").addEventListener("click", function () { if (mode !== "world") { setMode("world"); } });

  /* ページが隠れている間は止める */
  document.addEventListener("visibilitychange", function () { if (document.hidden) { clearTimeout(SL.tm); SL.tm = null; } else { schedule(); } });

  /* 幅が変わったときだけ組み直す（スマホの URL バーの出入りでは、動きの途中を壊さない） */
  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var w = cont.clientWidth;
      if (w === lastW) { return; }
      lastW = w; RV = {}; setTargets(); jump(); railState();
    }, 140);
  });

  counts();
  setMode("jp");
  lastW = cont.clientWidth;
  nudgeRail();
})();
</script>
</body>
</html>
