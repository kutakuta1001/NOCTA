<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>感動したこと — The First Flower</title>
    <meta name="description" content="The First Flower の作者が、その年に心が動いたことをひとことずつ書いています。一つ書くたびに、その年の花の花びらが一枚ふえます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Sans+JP:wght@300;400&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* TFF のトークン（the-first-flower/DESIGN-NOTES.md 2 章）＋葉の緑 */
        :root { --base: #FCFBF5; --dark: #705E92; --deep: #3D2E52; --sub: #7C6A9C; --accent: #B168A8; --leaf: #9FD3A4; --leaf2: #7FBF8C; }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; background: linear-gradient(180deg, #FCFBF5 0%, #F8F1F5 100%); color: var(--deep); font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; min-height: 100vh; }
        a:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }

        .back { display: inline-block; font-size: 13px; letter-spacing: .08em; color: var(--sub); text-decoration: none; }
        .back:hover { color: var(--accent); }
        .top { max-width: 980px; margin: 0 auto; padding: 32px 16px 0; }

        .hero { text-align: center; padding: 48px 16px 70px; }
        .hero .q { font-family: 'Cormorant Garamond', serif; font-style: italic; letter-spacing: 5px; color: var(--sub); font-size: 13px; margin: 0 0 10px; }
        .hero h1 { font-family: 'Noto Serif JP', serif; font-weight: 300; font-size: 30px; margin: 0; color: var(--dark); letter-spacing: 6px; }
        .hero .lead { font-family: 'Noto Serif JP', serif; font-weight: 300; font-size: 13.5px; line-height: 2.3; color: #5b4c70; margin: 20px 0 0; }
        .divider { width: 40px; height: 1px; background: var(--accent); margin: 18px auto 0; }

        /* 年の節: 左に大きな花、右に栞 */
        .yearsec.same-year { margin-bottom: 64px; }
        .yearsec { position: relative; max-width: 980px; margin: 0 auto 110px; padding: 0 16px; display: grid; grid-template-columns: 320px 1fr; gap: 48px; }
        .flowercol { position: sticky; top: 30px; align-self: start; text-align: center; }
        .year { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 40px; color: var(--dark); letter-spacing: 6px; margin: 0; }
        .kind { font-family: 'Noto Serif JP', serif; font-weight: 300; font-size: 12px; color: var(--dark); letter-spacing: 3px; margin-top: 2px; }
        .fsvg { width: 280px; height: 360px; display: block; margin: 0 auto; overflow: visible; }
        .petal { cursor: pointer; transform-box: view-box; transform-origin: 140px 140px; transform: rotate(var(--r)) scale(.15); opacity: .3; transition: transform 1.6s cubic-bezier(.2,.8,.2,1), opacity 1.2s, filter .3s; }
        .petal.open { transform: rotate(var(--r)) scale(1); opacity: .92; }
        .petal:hover { filter: drop-shadow(0 0 8px rgba(238,164,192,.9)); }
        .petal.now { filter: drop-shadow(0 0 10px rgba(177,104,168,.75)); opacity: 1; }
        /* 茎・葉の色と太さは SVG 属性で持つ（flower-kinds.js）。CSS では指定しない */
        .stem { fill: none; stroke-linecap: round; stroke-dasharray: 1 2; stroke-dashoffset: 1; transition: stroke-dashoffset 2.4s ease; }
        .leafbig { transform-box: fill-box; transform: scale(0); transition: transform 1.4s cubic-bezier(.2,.8,.2,1); }
        .leafbig.l1 { transform-origin: 100% 100%; }
        .leafbig.l2 { transform-origin: 0% 100%; }
        .grown .stem { stroke-dashoffset: 0; }
        .grown .leafbig { transform: scale(1); }
        .grown .leafbig.l1 { transition-delay: .9s; }
        .grown .leafbig.l2 { transition-delay: 1.3s; }
        .ghost { fill: none; stroke: #D0BFE0; stroke-width: 1; stroke-dasharray: 3 4; opacity: 0; transition: opacity 2s 1s; }
        .grown .ghost { opacity: .8; }
        .hint { font-size: 11px; color: var(--sub); letter-spacing: 2px; }
        .fsvg-sm { display: none; }

        /* 栞（1 件） */
        .cards { padding-top: 10px; position: relative; }
        .card { position: relative; background: #FFFDF8; border-radius: 4px; padding: 22px 22px 20px 84px; margin: 0 0 22px; box-shadow: 0 1px 0 rgba(61,46,82,.04), 0 8px 22px rgba(112,94,146,.08); opacity: 0; transform: translateY(18px); transition: opacity 1.1s, transform 1.1s, box-shadow .6s; scroll-margin-top: 110px; }
        .card.in { opacity: 1; transform: none; }
        .card.now { box-shadow: 0 0 0 1px rgba(177,104,168,.35), 0 10px 26px rgba(177,104,168,.16); }
        .card::after { content: ""; position: absolute; inset: 0; border-radius: 4px; background: repeating-linear-gradient(0deg, rgba(177,104,168,.022) 0 1px, transparent 1px 3px); pointer-events: none; }
        .pf { position: absolute; left: 18px; top: 20px; width: 50px; height: 50px; }
        .pf svg { overflow: visible; }
        .pf .p { transform-box: view-box; transform-origin: 50px 50px; transform: rotate(var(--r)) scale(0); transition: transform 1.5s .15s cubic-bezier(.2,.8,.2,1); }
        .card.in .pf .p { transform: rotate(var(--r)) scale(1); }
        .date { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: #9A4F92; letter-spacing: 2px; }
        .text { font-family: 'Noto Serif JP', serif; font-weight: 300; font-size: 14.5px; line-height: 2.2; margin: 2px 0 0; }
        .blog { display: inline-block; margin-top: 8px; font-size: 11.5px; letter-spacing: 2px; color: #9A4F92; text-decoration: none; border-bottom: 1px solid rgba(177,104,168,.35); }
        .blog:hover { color: var(--accent); }
        .photo { display: block; margin: 12px 0 0; padding: 0; border: 0; background: none; cursor: zoom-in; max-width: 100%; }
        .photo img { display: block; width: auto; height: auto; max-width: 100%; max-height: 320px; border-radius: 3px; }
        .photo:focus-visible { outline: 2px solid var(--deep); outline-offset: 3px; }
        #lb { padding: 0; border: 0; background: transparent; max-width: 94vw; max-height: 92vh; cursor: zoom-out; }
        #lb::backdrop { background: rgba(61,46,82,.82); }
        #lb img { display: block; max-width: 94vw; max-height: 92vh; width: auto; height: auto; border-radius: 3px; }
        .empty { font-family: 'Noto Serif JP', serif; font-weight: 300; font-size: 14px; line-height: 2.2; color: #5b4c70; padding: 40px 0 0; }

        /* 栞のあいだの草・年の終わりの下草 */
        .sprig { position: absolute; width: 46px; height: 40px; pointer-events: none; }
        .sprig path { fill: none; stroke: var(--leaf2); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 60; stroke-dashoffset: 60; transition: stroke-dashoffset 1.6s ease; }
        .sprig ellipse { fill: var(--leaf); transform-box: fill-box; transform-origin: 0% 100%; transform: scale(0); transition: transform 1.2s .7s cubic-bezier(.2,.8,.2,1); }
        .sprig.in path { stroke-dashoffset: 0; }
        .sprig.in ellipse { transform: scale(1) rotate(var(--lr, 0deg)); }
        .grass { position: absolute; bottom: -60px; left: 0; width: 100%; height: 60px; pointer-events: none; overflow: visible; }
        .grass path { fill: none; stroke: var(--leaf); stroke-width: 1.5; stroke-linecap: round; opacity: .8; transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }
        @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }

        .closing { text-align: center; padding: 30px 16px 90px; }
        .closing p { font-family: 'Noto Serif JP', serif; font-weight: 300; font-size: 15px; letter-spacing: 3px; color: var(--dark); margin: 0 0 36px; }

        @media (max-width: 760px) {
            .yearsec { grid-template-columns: 1fr; gap: 8px; }
            .flowercol { position: sticky; top: 0; z-index: 2; background: #FCFBF5; box-shadow: 0 10px 14px -10px rgba(112,94,146,.18); margin: 0 -16px; padding: 8px 16px 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
            .year { font-size: 28px; }
            .fsvg { display: none; }
            .fsvg-sm { display: block; width: 78px; height: 78px; overflow: visible; }
            .hint { display: none; }
            .card { padding-left: 72px; }
            .sprig { display: none; }
            .empty { padding-top: 16px; text-align: center; }
        }
        /* 動きを止める設定: 花は静止した最終形、栞は最初から見える */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .petal, .pf .p, .stem, .leafbig, .ghost, .card, .sprig path, .sprig ellipse { transition: none !important; }
            .card { opacity: 1; transform: none; }
            .petal { transform: rotate(var(--r)) scale(1); opacity: .92; }
            .stem { stroke-dashoffset: 0; }
            .leafbig { transform: scale(1); }
            .ghost { opacity: .8; }
            .sprig path { stroke-dashoffset: 0; }
            .sprig ellipse { transform: scale(1) rotate(var(--lr, 0deg)); }
            .pf .p { transform: rotate(var(--r)) scale(1); }
            .grass path { animation: none; }
        }
    </style>
</head>
<body>
    <div class="top"><a href="../index.html#profile" class="back">← The First Flower</a></div>

    <header class="hero">
        <p class="q">Kandō Diary</p>
        <h1>感動したこと</h1>
        <div class="divider"></div>
        <p class="lead">その年に、心が動いたことをひとことずつ。<br>一つ書くたびに花びらが開き、六つで一輪の花が咲きます。</p>
    </header>

    <main id="years"></main>

    <footer class="closing">
        <p>あなたの今年は、どんな花が咲きましたか。</p>
        <a href="../index.html#profile" class="back">← The First Flower</a>
    </footer>

    <dialog id="lb" aria-label="写真"><img alt=""></dialog>

    <script src="flower-kinds.js"></script>
    <script src="kandou-data.js"></script>
    <script src="kandou-app.js"></script>
</body>
</html>
