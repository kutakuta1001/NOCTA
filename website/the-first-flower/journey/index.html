<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅の一枚 — The First Flower</title>
    <meta name="description" content="The First Flower の作者が、日本と世界の行った場所で撮った景色を地域ごとに選んで並べています。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* TFF のトークン（the-first-flower/DESIGN-NOTES.md 2 章） */
        :root {
            --jr-base: #FCFBF5;
            --jr-text: #3D2E52;
            --jr-sub: #9A86B0;
            --jr-visited: #EEA4C0;
            --jr-current: #B168A8;
            --jr-unvisited: #E6E0EC;
        }
        [hidden] { display: none !important; }
        body { background: var(--jr-base); color: var(--jr-text); font-family: 'Noto Sans JP', sans-serif; }
        .jr-serif { font-family: 'Cormorant Garamond', 'Noto Serif JP', serif; }
        .jr-jpserif { font-family: 'Noto Serif JP', serif; }

        .jr-back { color: var(--jr-sub); font-size: 13px; letter-spacing: .08em; }
        .jr-back:hover { color: var(--jr-current); }

        /* 日本 / 世界 */
        /* 2 つの面があると一目でわかるよう、件数つきの切り替えにする */
        #jr-tabs { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--jr-unvisited); }
        .jr-tab { font-size: 14px; padding: 6px 18px; border-radius: 999px; color: var(--jr-text); display: inline-flex; align-items: baseline; gap: 6px; }
        .jr-tab .jr-count { font-size: 12px; color: var(--jr-sub); }
        .jr-tab[aria-selected="true"] { background: #fff; box-shadow: 0 1px 3px rgba(61, 46, 82, .12); }
        .jr-tab[aria-selected="false"]:hover { color: var(--jr-current); }

        /* 都道府県タイル（12 列 × 14 行） */
        #jr-map { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(14, auto); gap: 3px; max-width: 460px; }
        .jr-tile { aspect-ratio: 1; border-radius: 4px; background: var(--jr-unvisited); color: rgba(61, 46, 82, .45);
                   font-family: 'Noto Serif JP', serif; font-size: clamp(9px, 1.6vw, 13px); line-height: 1; display: flex; align-items: center; justify-content: center; }
        .jr-tile.is-visited { background: var(--jr-visited); color: var(--jr-text); cursor: pointer; }
        .jr-tile.is-visited:hover { filter: brightness(1.05); }
        .jr-tile.is-current { background: var(--jr-current); color: #fff; }
        .jr-tile[aria-disabled="true"] { cursor: default; }
        .jr-tile:focus-visible, .jr-chip:focus-visible, .jr-thumb:focus-visible, .jr-tab:focus-visible, .jr-back:focus-visible {
            outline: 2px solid var(--jr-text); outline-offset: 2px; }

        /* 行った場所の一覧・地点 */
        .jr-chip { font-size: 13px; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(177, 104, 168, .35); color: var(--jr-text); background: transparent; }
        .jr-chip:hover { border-color: var(--jr-current); }
        .jr-chip[aria-pressed="true"] { background: var(--jr-current); border-color: var(--jr-current); color: #fff; }
        .jr-chip .jr-sub-n { font-size: 11px; margin-left: 4px; color: var(--jr-current); }
        .jr-chip[aria-pressed="true"] .jr-sub-n { color: rgba(255, 255, 255, .85); }
        .jr-tile { position: relative; }
        .jr-tile.has-places::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--jr-current); }
        .jr-tile.is-current.has-places::after { background: #fff; }
        /* 県の中の地点: 写真のすぐ上に、切り替えとして並べる */
        #jr-places { display: flex; flex-wrap: wrap; gap: 6px; }
        #jr-places:empty { display: none; }

        /* 写真 */
        /* 枠は写真の縦横比に合わせる（--jr-ar を journey-app.js が写真ごとに入れる）。縦長でも画面の 78% までの高さに収める */
        .jr-frame { --jr-ar: 1.5; position: relative; aspect-ratio: var(--jr-ar); width: min(100%, calc(78vh * var(--jr-ar)));
                    background: #EFEAF1; border-radius: 6px; overflow: hidden; }
        .jr-main { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity .45s ease; }
        .jr-main.is-loading { opacity: 0; }
        #jr-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
                     font-family: 'Noto Serif JP', serif; font-size: 15px; color: var(--jr-sub); pointer-events: none; }
        #jr-status:empty { display: none; }
        .jr-thumb { width: 84px; aspect-ratio: 3 / 2; border-radius: 4px; overflow: hidden; opacity: .6; outline-offset: 2px; }
        .jr-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .jr-thumb { position: relative; }
        .jr-thumb[aria-current="true"] { opacity: 1; outline: 2px solid var(--jr-current); }
        .jr-thumb.is-new::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%;
                                  background: var(--jr-visited); box-shadow: 0 0 0 2px #fff; }
        .jr-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; z-index: 3;
                  background: rgba(252, 251, 245, .82); color: var(--jr-text); font-size: 20px; line-height: 1;
                  display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(61, 46, 82, .18); }
        .jr-nav:hover { background: #fff; }
        .jr-nav:focus-visible { outline: 2px solid var(--jr-text); outline-offset: 2px; }
        .jr-prev { left: 10px; } .jr-next { right: 10px; }
        #jr-pos { position: absolute; left: 10px; bottom: 10px; z-index: 3; font-size: 12px; letter-spacing: .06em; padding: 3px 10px;
                  border-radius: 999px; background: rgba(61, 46, 82, .62); color: #fff; pointer-events: none; }
        #jr-pos:empty { display: none; }
        #jr-found { font-size: 13px; color: var(--jr-sub); }
        #jr-found b { font-weight: 500; color: var(--jr-current); }

        .jr-thumb:hover { opacity: 1; }

        @media (prefers-reduced-motion: reduce) {
            .jr-main { transition: none; }
        }
    </style>
</head>
<body class="min-h-screen">
    <header class="max-w-6xl mx-auto px-4 sm:px-8 pt-8">
        <a href="../index.html#profile" class="jr-back">← The First Flower</a>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-8 pt-10 pb-24">
        <h1 class="jr-jpserif text-[30px] sm:text-[38px] leading-tight">旅の一枚</h1>
        <p class="mt-3 text-[14px] leading-7" style="color: var(--jr-sub)">地図で地域を押すと、そこで撮った景色が出ます。</p>
        <p id="jr-found" class="mt-1" hidden></p>

        <div class="mt-10 grid gap-10 md:grid-cols-[5fr_7fr] md:gap-14 items-start">
            <!-- 左: 地図と行った場所 -->
            <section aria-label="地域を選ぶ">
                <div id="jr-tabs" role="tablist" class="mb-5">
                    <button type="button" role="tab" class="jr-tab" data-mode="jp" aria-selected="true">日本<span class="jr-count"></span></button>
                    <button type="button" role="tab" class="jr-tab" data-mode="world" aria-selected="false">世界<span class="jr-count"></span></button>
                </div>
                <div id="jr-map" aria-label="日本地図"></div>
                <ul id="jr-list" class="mt-6 flex flex-wrap gap-2" aria-label="写真のある地域"></ul>
            </section>

            <!-- 右: 写真 -->
            <section id="jr-photo" aria-live="polite" class="md:sticky md:top-8 scroll-mt-4">
                <h2 id="jr-label" class="jr-jpserif text-[24px] sm:text-[28px] leading-snug"></h2>
                <div id="jr-places" class="mt-3" aria-label="この地域の中の場所"></div>
                <div class="jr-frame mt-4">
                    <img class="jr-main" alt="" hidden>
                    <p id="jr-status"></p>
                    <button type="button" class="jr-nav jr-prev" aria-label="前の写真" hidden>‹</button>
                    <button type="button" class="jr-nav jr-next" aria-label="次の写真" hidden>›</button>
                    <span id="jr-pos" aria-hidden="true"></span>
                </div>
                <div id="jr-thumbs" class="mt-3 flex flex-wrap gap-2"></div>
                <p class="mt-3 text-[13px]" style="color: var(--jr-sub)"><span id="jr-taken"></span></p>
                <p id="jr-caption" class="jr-jpserif mt-2 text-[15px] leading-8"></p>
            </section>
        </div>
    </main>

    <script src="journey-core.js?v=20261101"></script>
    <script src="journey-map.js?v=20261101"></script>
    <script src="tff-journey-data.js?v=20261101"></script>
    <script src="journey-fx.js?v=20261105"></script>
    <script src="journey-app.js?v=20261101"></script>
</body>
</html>
